<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Theme: ALIAS the frame's vars, never redeclare them. Your <style> is injected after the frame's,
     so writing --foreground/--card here would silently replace the app's live theme AND defeat the
     standalone test below, which reads --foreground. Prefix, app var first, fallback in the var(). */
  :root {
    --w-fg:     var(--foreground,        #1b1b1f);
    --w-muted:  var(--muted-foreground,  #5c5c68);
    --w-accent: var(--accent,            #2f6fd0);
    --w-border: var(--border,            #d6d6dd);
    --w-card:   var(--card,              #ffffff);
    --w-alert:  #c0392b;                 /* colours the frame does not supply */
    --w-ok:     #1e8449;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --w-fg:     var(--foreground,        #e9e9f0);
      --w-muted:  var(--muted-foreground,  #a4a4b0);
      --w-accent: var(--accent,            #7ab6ff);
      --w-border: var(--border,            #3a3a45);
      --w-card:   var(--card,              #1a1a20);
      --w-alert:  #ff8f7e;
      --w-ok:     #6ee7a8;
    }
  }
  /* Painted ONLY when the frame is absent (user opened the file directly). */
  body.standalone { background: var(--w-card); color: var(--w-fg); }
  body.standalone .wrap { padding: 18px; }

  /* No font-family here — the frame injects the app font. */
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap { width: 860px; max-width: 100%; padding: 4px 0 12px; }  /* flush-left, no centering */
  .card { background: var(--w-card); border: 1px solid var(--w-border); border-radius: 12px; padding: 14px 16px; margin: 10px 0; }
  .card h3 { margin: 0 0 6px; font-size: 15px; color: var(--w-fg); }
  canvas { width: 100%; display: block; border: 1px solid var(--w-border); border-radius: 8px; margin-top: 8px; }
  .btn { padding: 6px 12px; border: 1px solid var(--w-border); background: transparent; color: var(--w-fg); border-radius: 7px; cursor: pointer; font-size: 13px; }
  .btn.primary { border-color: var(--w-accent); color: var(--w-accent); }
  .ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 13px; color: var(--w-muted); }
</style></head>
<body><div class="wrap">
  <div class="card">
    <h3>Concept title</h3>
    <canvas id="c" width="820" height="260"></canvas>
    <div class="ctl"><button class="btn primary" id="play">▶ Play</button><button class="btn" id="reset">↺ Reset</button></div>
  </div>
</div>
<script>
(() => {
  const rootEl = document.documentElement;

  // Extra colours come from the FRAME's text luminance, not the OS media query: a dark app on a light
  // OS is routine and the media query would pick the wrong palette for it.
  function lum(hex){
    const m = /^#([0-9a-f]{6})$/i.exec((hex||'').trim()); if (!m) return 0;
    const a = [0,2,4].map(i => parseInt(m[1].substr(i,2),16)/255)
                   .map(v => v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4));
    return 0.2126*a[0] + 0.7152*a[1] + 0.0722*a[2];
  }
  const framed = getComputedStyle(rootEl).getPropertyValue('--foreground').trim() !== '';
  document.body.classList.toggle('standalone', !framed);
  if (framed && lum(getComputedStyle(rootEl).getPropertyValue('--foreground')) > 0.5) {
    rootEl.style.setProperty('--w-alert', '#ff8f7e');   // light app text => dark app theme
    rootEl.style.setProperty('--w-ok',    '#6ee7a8');
  }

  const cs = getComputedStyle(rootEl);
  const C = {
    fg:    cs.getPropertyValue('--w-fg').trim(),
    muted: cs.getPropertyValue('--w-muted').trim(),
    accent:cs.getPropertyValue('--w-accent').trim(),
    border:cs.getPropertyValue('--w-border').trim(),
    card:  cs.getPropertyValue('--w-card').trim(),
    alert: cs.getPropertyValue('--w-alert').trim(),
    ok:    cs.getPropertyValue('--w-ok').trim()
  };
  const $ = s => document.querySelector(s);

  // Canvas = fixed internal resolution + CSS width:100%.
  // Never size off getBoundingClientRect (0 on hidden tabs -> blank layer).
  function base(canvas){
    const ctx = canvas.getContext('2d');
    const d = Math.min(window.devicePixelRatio || 1, 2);
    ctx.setTransform(d,0,0,d,0,0);
    return {ctx, w:canvas.width, h:canvas.height};
  }
  function axes(o, area, xmin, xmax, ymin, ymax){
    const {ctx} = o; ctx.strokeStyle = C.border; ctx.lineWidth = 1;
    ctx.strokeRect(area.x, area.y, area.w, area.h);
    ctx.strokeStyle = C.muted;
    const py = area.y + area.h - (0-ymin)/(ymax-ymin)*area.h;
    ctx.beginPath(); ctx.moveTo(area.x,py); ctx.lineTo(area.x+area.w,py); ctx.stroke();
  }
  function series(o, area, arr, xmin, xmax, ymin, ymax, color){
    const {ctx} = o; const n=arr.length; ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
    for (let i=0;i<n;i++){ const px=area.x+i/(n-1)*area.w; const py=area.y+area.h-(arr[i]-ymin)/(ymax-ymin)*area.h; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.stroke();
  }

  // Compute your data arrays once, then animate a time cursor.
  const T=6, dt=0.02; const U=[], X=[]; let x=0;
  for (let i=0;i<=Math.round(T/dt);i++){ const t=i*dt; const u=(t>=0.4&&t<2.6)?1:0; x+=u*dt; U.push(u); X.push(x); }
  const st = {t:0, playing:true, last:0};

  function draw(){
    const o = base($('#c')); const {ctx}=o;
    ctx.clearRect(0,0,o.w,o.h);
    const area = {x:46,y:16,w:o.w-70,h:o.h-40};
    const xmax = Math.max(...X)*1.1;
    axes(o, area, 0, T, 0, xmax);
    series(o, area, X, 0, T, 0, xmax, C.accent);
    // time cursor — every colour comes from a theme var, including this one
    const px = area.x + st.t/T*area.w;
    ctx.strokeStyle = C.alert; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(px,area.y); ctx.lineTo(px,area.y+area.h); ctx.stroke(); ctx.setLineDash([]);
  }
  function loop(ts){ if (st.playing){ st.t += (ts-st.last)/1000; if (st.t>=T) st.t=0; } st.last=ts; draw(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  $('#play').addEventListener('click', () => { st.playing=!st.playing; $('#play').textContent = st.playing?'⏸ Pause':'▶ Play'; });
  $('#reset').addEventListener('click', () => { st.t=0; });

  // Probe hook — the probe IS your eyes when you cannot see the render.
  // See references/widget-verification-probes.md for the assertion recipe.
  window.__w = {
    state: function(){ return {t:st.t, playing:st.playing, n:X.length,
                              theme:{framed:framed, fg:C.fg}}; },
    set:   function(t){ st.t = t; draw(); },
    ink:   function(id){ const c=document.getElementById(id), g=c.getContext('2d');
             const d=g.getImageData(0,0,c.width,c.height).data; let n=0;
             for(let i=3;i<d.length;i+=4){ if(d[i]>8) n++; } return n; }
  };
})();
</script></body></html>
